android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# Gradle daemon heap (8 GB RAM machine)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon.performance.disable-logging=true

# Kotlin compiler daemon (reduced to avoid kapt daemon crashes on 8 GB RAM)
kotlin.daemon.jvmargs=-Xmx1024m
